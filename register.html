<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeXT AI - Inscription</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="center-layout">
  <div class="card form-card">
    <h2>Inscription</h2>
    <form id="registerForm">
      <div class="input-group">
        <label for="name">Nom d'utilisateur</label>
        <input type="text" id="name" required placeholder="Pseudo">
      </div>
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="exemple@mail.com">
      </div>
      <div class="input-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary full-width">Créer un compte</button>
    </form>
    <p class="auth-link">Déjà un compte ? <a href="login.html">Se connecter</a></p>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', (e) => {
      e.preventDefault();
      window.location.href = 'chat.html';
    });
  </script>
</body>
</html>
