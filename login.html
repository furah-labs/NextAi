<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeXT AI - Connexion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="center-layout">
  <div class="card form-card">
    <h2>Connexion</h2>
    <form id="loginForm">
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="exemple@mail.com">
      </div>
      <div class="input-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary full-width">Se connecter</button>
    </form>
    <p class="auth-link">Pas encore de compte ? <a href="register.html">S'inscrire</a></p>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      // Redirection vers le chat après connexion
      window.location.href = 'chat.html';
    });
  </script>
</body>
</html>
